# Include these locations inside the authenticated harn.miposts.com server.
# The prefix keeps this hackathon isolated from the older console at `/`.
location = /alpaca {
    return 301 /alpaca/;
}

location ^~ /alpaca/api/v1/ {
    if ($remote_user = demo) { return 403; }

    proxy_pass http://127.0.0.1:8890/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Operator-User $remote_user;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location ^~ /alpaca/api/ {
    # The demo login is read-only: it may watch the console but never pause
    # the runner or rewrite the trajectory through the dashboard API.
    set $demo_write "";
    if ($request_method !~ ^(GET|HEAD)$) { set $demo_write $remote_user; }
    if ($demo_write = demo) { return 403; }

    proxy_pass http://127.0.0.1:8130/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Operator-User $remote_user;
    proxy_buffering off;
    proxy_read_timeout 120s;
}

location ^~ /alpaca/ {
    proxy_pass http://127.0.0.1:8130/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Operator-User $remote_user;
}

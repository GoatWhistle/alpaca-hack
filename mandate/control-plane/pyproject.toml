[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mandate-control-plane"
version = "0.1.0"
description = "Operator dashboard and runtime configuration for MANDATE"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "starlette>=0.38,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
mandate-dashboard = "mandate_control.dashboard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mandate_control"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

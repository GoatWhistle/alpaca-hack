[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mandate-guard"
version = "0.1.0"
description = "Deterministic paper-trading mandate guard for MANDATE"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "starlette>=1,<2",
  "uvicorn>=0.42,<1",
]

[project.scripts]
mandate-guard = "mandate_guard.server:main"
mandate-dashboard = "mandate_guard.dashboard:main"

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mandate_guard"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

name: ai-platforms-infrastructure-aggressive-short-2026-08-28
universe: [AAPL, MSFT, NVDA, GOOGL, AMZN, META, AMD, AVGO, ORCL, IBM, PLTR, CRM, ANET, TSM, ASML, ARM, BABA, BIDU, SPY]
instruments: [equity]
order_types: [limit]
session: regular_hours_only
limits:
  max_position_pct: 50
  max_gross_exposure_pct: 95
  max_daily_loss_pct: 10
  max_orders_per_day: 5000
wake_me_if:
  - daily_loss_pct > 8
  - single_symbol_move_pct > 8
  - any_breach_requiring_override > 0
predecided:
  - when: daily_loss_pct >= 8
    then: park_new_orders
    reason: "Ultra aggressive: hard stop at 8% before 10% daily loss."
  - when: single_symbol_move_pct >= 8
    then: park_new_orders
    reason: "Ultra aggressive short: 8% move parks new positions."
allow_short_positions: true
allow_risk_reducing_market_close: true
short_limits:
  max_short_position_pct: 40       # was 10, now near long cap
  max_short_gross_exposure_pct: 80 # was 40, now 80% short book allowed
  min_net_exposure_pct: -70        # was -30, now deep net-short allowed
expires: 2099-08-28T20:00:00Z

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mandate-research"
version = "0.1.0"
description = "Unprivileged news and strategy research for MANDATE"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.13,<2",
]

[project.scripts]
mandate-research-mcp = "mandate_research.server:main"

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mandate_research"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
